name: Publish website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Daily menu forecast']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - uses: actions/checkout@v4
        with:
          ref: daily-data
          path: daily-state
      - name: Prepare current website with saved daily records
        run: |
          cp source/web/daily.html daily-state/site/index.html
          cp -R source/web/assets/. daily-state/site/assets/
          test -f daily-state/site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: daily-state/site
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
