name: Verify model and daily pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.2'
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python scripts/verify_artifacts.py --portable
